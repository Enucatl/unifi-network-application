services:
  uosserver:
    image: 11notes/uosserver:5.1.42
    cpus: 8
    mem_reservation: 4g
    mem_limit: 8g
    runtime: sysbox-runc
    cap_add:
      - NET_RAW
      - NET_ADMIN
    cgroup: host
    # ponytail: normalize image UID artifacts caused by the host's Docker
    # userns-remap storage; remove when the image handles this itself.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        chown -R root:root /etc/sudo.conf /etc/sudoers /etc/sudoers.d /usr/bin/sudo /usr/lib/sudo
        chmod 0644 /etc/sudo.conf
        chmod 4755 /usr/bin/sudo
        chown rabbitmq:rabbitmq /home/rabbitmq/.erlang.cookie
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq
        printf 'UniFi OS Server\n' > /usr/lib/product_name
        printf 'UOSSERVER\n' > /usr/lib/app_model
        mkdir -p /data/unifi-core/config/http
        exec /usr/local/bin/entrypoint.sh
    environment:
      TZ: Europe/Zurich
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP:-atlas.home.arpa}
    volumes:
      - uosserver-persistent:/persistent
      - uosserver-data:/data
      - uosserver-srv:/srv
      - uosserver-unifi:/var/lib/unifi
      - uosserver-mongodb:/var/lib/mongodb
      - uosserver-rabbitmq-ssl:/etc/rabbitmq/ssl
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/log:rw,exec,nosuid,size=128m
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    ports:
      - 3478:3478/udp
      - 5005:5005
      - 5514:5514/udp
      - 5671:5671
      - 6789:6789
      - 8080:8080
      - 8443:8443
      - 8444:8444
      - 8843:8843
      - 8880:8880
      - 8881:8881
      - 8882:8882
      - 9543:9543
      - 10001:10001/udp
      - 10003:10003/udp
      - 11084:11084
    labels:
      - traefik.enable=true
      - traefik.docker.network=unifi-network-application_traefik
      - traefik.http.routers.unifi.entrypoints=https
      - traefik.http.routers.unifi.rule=Host(`unifi.${DOCKER_DOMAIN}`)
      - traefik.http.routers.unifi.tls=true
      - traefik.http.services.unifi.loadbalancer.server.scheme=https
      - traefik.http.services.unifi.loadbalancer.server.port=443
      - traefik.http.services.unifi.loadbalancer.serversTransport=unifi@file
    networks:
      - unifi-network-application_traefik
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 443

networks:
  unifi-network-application_traefik:
    name: unifi-network-application_traefik
    enable_ipv6: true

volumes:
  uosserver-persistent:
  uosserver-data:
  uosserver-srv:
  uosserver-unifi:
  uosserver-mongodb:
  uosserver-rabbitmq-ssl:
